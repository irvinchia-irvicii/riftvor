<div id="art-modal" class="modal art-modal hidden" role="dialog" aria-modal="true"
     aria-labelledby="art-modal-title">
  <div class="art-viewer">
    <button id="art-modal-close" class="ghost art-close" type="button"
            aria-label="Close card image">✕</button>
    <img id="art-modal-image" alt="">
    <div class="art-caption">
      <strong id="art-modal-title">Card image</strong>
      <span id="art-modal-code" class="sub"></span>
    </div>
  </div>
</div>
