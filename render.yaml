# render.yaml — Stage 0 of HOSTING.md: the egress gate test.
#
# Purpose of this deploy is ONE question: do the five SG Shopify stores and
# Cards Central answer a scraper calling from a datacenter IP? Everything
# here is sized for that test and nothing more.
#
# Free plan on purpose: no persistent disk, so state/riftvor.db is ephemeral
# and dies with the instance. That is fine — Stage 0 reads sync_meta once,
# right after a forced sync. Stage A swaps plan: starter and adds a 1 GB disk
# mounted at state/.
services:
  - type: web
    name: riftvor
    runtime: python
    region: singapore        # lowest latency to the SG stores; does NOT dodge
    plan: free               # bot detection — Cloudflare classifies by ASN.
    buildCommand: pip install -r requirements.txt
    # --workers 1 is load-bearing, not a cost saving: _SYNC_LOCK (sync.py),
    # _BREAKERS (stores.py) and Carousell's _cache are module-level state.
    # A second worker silently breaks sync-storm protection and per-store
    # circuit breakers. Threads are fine — ensure_fresh() calls asyncio.run()
    # inside a request thread, which works threaded and breaks under ASGI.
    # --timeout 120: a cold forced sync of five catalogs outruns the 30s default.
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: RIFTVOR_HOST
        value: 0.0.0.0        # declares "publicly reachable" → app.py then
                              # refuses to boot without an auth password.
      - key: RIFTVOR_AUTH_USER
        value: riotgames
      - key: RIFTVOR_AUTH_PASSWORD_HASH
        value: 'scrypt:32768:8:1$Dx5D42f7Qndv2fqt$a45ecfcdbc7ec775f30a4864414ee6efd46922c6f82d6cdd8b53c390bc1e4363477d51055e5841a4a44192b1c5a1c56fce8100b3208529111f4f3b1b243a014b'
      - key: RIFTVOR_REVIEW_ACCOUNT_USERNAME
        value: riotgames
      - key: RIFTVOR_REVIEW_ACCOUNT_PASSWORD_HASH
        value: 'scrypt:32768:8:1$Dx5D42f7Qndv2fqt$a45ecfcdbc7ec775f30a4864414ee6efd46922c6f82d6cdd8b53c390bc1e4363477d51055e5841a4a44192b1c5a1c56fce8100b3208529111f4f3b1b243a014b'
      - key: RIFTVOR_BASE_URL
        sync: false           # set to the service URL once Render assigns it
      - key: RIFTVOR_CATALOG_MODE
        value: snapshot       # reliable review search; no blocked live scraping

      # ── Polite pacing (Stage 0 re-test, HOSTING.md "Stage 0 result") ──
      # Set ONLY here. The Mac keeps the fast parallel defaults; a datacenter
      # IP's problem is no reason to slow down the residential path.
      # A full crawl at these settings takes minutes, so /api/refresh runs
      # detached and reports via GET /api/state.
      - key: RIFTVOR_SEQUENTIAL_SYNC
        value: "1"            # one store at a time, not five at once
      - key: RIFTVOR_PAGE_DELAY_S
        value: "3"            # was 0.5 between pages within a store
      - key: RIFTVOR_STORE_DELAY_S
        value: "10"           # pause between stores

      # Egress proxy. Stage 0 showed Shopify's edge refuses this app from
      # datacenter IPs regardless of pacing; 3vor Fetch reached the same
      # conclusion and solved it the same way. Set the value in the Render
      # dashboard — it carries credentials and must never land in the repo.
      # Accepts http://user:pass@host:port or host|port|user|pass.
      # Leave unset and the app runs direct, exactly as it does today.
      - key: RIFTVOR_PROXY_URL
        sync: false
